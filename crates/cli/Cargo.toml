[package]
name = "rustveil-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
keywords.workspace = true
categories = ["command-line-utilities", "development-tools"]
description = "Copy a Rust project and obfuscate selected source files"
readme = "README.md"

[[bin]]
name = "rustveil"
path = "src/main.rs"
doc = false

[dependencies]
rustveil-core.workspace = true
syn.workspace = true
prettyplease = "0.2"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
walkdir = "2"
globset = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"


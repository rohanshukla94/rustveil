name: rustveil
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tested toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt,clippy
      - run: cargo +1.99.0 fmt --all -- --check
      - run: cargo +1.99.0 test --workspace --locked
      - run: cargo +1.99.0 test --workspace --all-features --locked
      - run: cargo +1.99.0 clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo +1.99.0 run -p workspace-app --release --features obfuscation --locked
